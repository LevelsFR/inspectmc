plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.147'
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.neoforged.net/releases/' }
    maven { url = 'https://maven.shedaniel.me/' }
}

sourceSets.main.java.srcDirs = [
        rootProject.file('../../common/src/main/java'),
        rootProject.file('../../neoforge/src/main/java'),
        project.file('src/main/java')
]
sourceSets.main.resources.srcDirs = [project.file('src/main/resources')]
sourceSets.main.java.exclude(
        'com/levelsfr/inspectmc/cobblemon/CobblemonApiIntegration.java',
        'com/levelsfr/inspectmc/client/config/ClothConfigUnavailableScreen.java',
        'com/levelsfr/inspectmc/neoforge/client/InspectMCNeoForgeClient.java',
        'com/levelsfr/inspectmc/neoforge/InspectMCNeoForge.java',
        'com/levelsfr/inspectmc/inspection/BiomeInspector.java'
)

neoForge {
    version = rootProject.neoforge_version

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        inspectmc {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    compileOnly "me.shedaniel.cloth:cloth-config-neoforge:${rootProject.cloth_config_version}"
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') {
        expand 'version': project.version
    }
}

base {
    archivesName = "${rootProject.archives_name}-neoforge"
}
